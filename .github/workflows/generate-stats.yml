name: Publish blog stats

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: '05 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download logs from artifact
        uses: dawidd6/action-download-artifact@8a338493df3d275e4a7a63bcff3b8fe97e51a927 # v19
        with:
          name: logs-tarball
          if_no_artifact_found: warn

      - name: Extract logs
        run: |
          #!/bin/bash
          if [ -e logs.tar.zst ]; then
            zstd -d --rm logs.tar.zst
            tar -xf logs.tar
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: arn:aws:iam::911986281031:role/github-actions-thetanerd.com-stats
          role-duration-seconds: 900
          aws-region: us-east-1

      - name: Create directories
        run: mkdir -p logs public

      - name: Download log files
        run: aws s3 sync --size-only s3://thetanerd.com-logs/ logs/

      - name: Run goaccess via container
        run: |
          find logs -name "*.gz" | \
            xargs zcat | \
            grep -Ev '/ghost|/members' | \
            docker run --rm -i -e LANG=$LANG docker.io/allinurl/goaccess:1.10.1 \
              --log-format CLOUDFRONT \
              --date-format CLOUDFRONT \
              --time-format CLOUDFRONT \
              --agent-list \
              --ignore-status=301 \
              --ignore-status=302 \
              --ignore-crawlers \
              --anonymize-ip \
              --http-protocol=no \
              --http-method=no \
              --no-query-string \
              --output html - > public/index.html
              
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Create log tarball
        run: |
          tar -cf logs.tar logs
          zstd --rm -T0 logs.tar

      - name: Store log tarball in artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs-tarball
          path: logs.tar.zst

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
