name: Publish blog stats

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: '05 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Download logs from artifact
        uses: dawidd6/action-download-artifact@v12
        with:
          name: logs-tarball
          if_no_artifact_found: warn

      - name: Extract logs
        run: |
          #!/bin/bash
          if [ -e logs.tar.zst ]; then
            zstd -d --rm logs.tar.zst
            tar -xf logs.tar
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::911986281031:role/github-actions-thetanerd.com-stats
          role-duration-seconds: 900
          aws-region: us-east-1

      - name: Create directories
        run: mkdir -p logs public

      - name: Download log files
        run: aws s3 sync --size-only s3://thetanerd.com-logs/ logs/

      - name: Run goaccess via container
        run: |
          find logs -name "*.gz" | \
            xargs zcat | \
            grep -Ev '/ghost|/members' | \
            docker run --rm -i -e LANG=$LANG docker.io/allinurl/goaccess:1.9.4 \
              --log-format CLOUDFRONT \
              --date-format CLOUDFRONT \
              --time-format CLOUDFRONT \
              --agent-list \
              --ignore-status=301 \
              --ignore-status=302 \
              --ignore-crawlers \
              --anonymize-ip \
              --http-protocol=no \
              --http-method=no \
              --no-query-string \
              --output html - > public/index.html
              
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Create log tarball
        run: |
          tar -cf logs.tar logs
          zstd --rm -T0 logs.tar

      - name: Store log tarball in artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: logs-tarball
          path: logs.tar.zst

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
